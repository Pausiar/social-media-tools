[package]
name = "pausiar-tools"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", features = ["http"] }
gloo-storage = "0.3"
gloo-timers = "0.3"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Blob",
  "BlobPropertyBag",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "History",
  "HtmlDialogElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "Location",
  "MouseEvent",
  "Node",
  "Storage",
  "SubmitEvent",
  "Url",
  "UrlSearchParams",
  "Window",
] }
yew = { version = "0.21", features = ["csr"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
